appId: jp.kuro0315.pupa
productName: Pupa
copyright: Copyright © 2026 kuro0315
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - assets/**/*
  - package.json
  - '!**/*.map'
asar: true
npmRebuild: false
# CI creates development artifacts only. There is deliberately no release provider.
publish: null
artifactName: Pupa-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.productivity
  icon: assets/icon.icns
  # No Developer ID credentials have been supplied. Do not imply trusted signing.
  identity: null
  notarize: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  icon: assets/icon.icns
  background: build/background.png
  title: Pupa ${version}
  window:
    width: 540
    height: 380
  iconSize: 90
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: Pupa-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Pupa
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  deleteAppDataOnUninstall: false
portable:
  artifactName: Pupa-${version}-windows-${arch}-portable.${ext}
linux:
  icon: assets/icon.png
  executableName: pupa
  maintainer: kuro0315
  category: Utility
  synopsis: A little magic for your clipboard
  description: A local-first text clipboard manager with a card-fan interface.
  syncDesktopName: true
  desktop:
    entry:
      Name: Pupa
      Comment: A little magic for your clipboard
      Terminal: 'false'
      StartupWMClass: jp.kuro0315.pupa
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
