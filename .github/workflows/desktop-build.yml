name: Build desktop apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Build artifacts are not public Releases. No job receives write permission.
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows
            args: --win --x64
          - name: macOS Apple Silicon and Intel
            os: macos-latest
            platform: macos
            args: --mac --arm64 --x64
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            args: --linux --x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libopenjp2-tools xvfb
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build renderer
        run: npm run build
      - name: Install UI test browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Verify browser UI
        if: runner.os == 'Linux'
        run: npm run test:ui
      - name: Smoke-test native Electron with synthetic clipboard
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/desktop-smoke.cjs
      - name: Upload UI screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: Pupa-ui-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 0
      - name: Package native desktop apps (not signed for distribution)
        run: npm run dist -- ${{ matrix.args }} --publish never
      - name: Generate checksums
        run: node scripts/checksums.cjs
      - name: Upload development installers
        uses: actions/upload-artifact@v7
        with:
          name: Pupa-${{ matrix.platform }}-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
