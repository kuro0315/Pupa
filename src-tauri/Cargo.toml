[package]
name = "pupa"
version = "0.2.3"
description = "Private, local clipboard cards"
authors = ["Pupa contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "pupa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pupa"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:raw-window-handle", "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-single-instance", "portal", "dep:gtk"]
# The portal adapter can be checked/tested without linking GTK or launching a desktop.
portal = ["dep:ashpd", "dep:tokio", "dep:futures-util"]
# Explicit synthetic-only native test binary. Never included in distribution builds.
smoke-test = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = "1"
base64 = "0.22"
tempfile = "3"
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "global_shortcuts"], optional = true }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"], optional = true }
futures-util = { version = "0.3", optional = true }
gtk = { version = "0.18", optional = true }
